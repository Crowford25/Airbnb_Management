services:
  web:
    build:
      context: .
      target: web
    env_file: .env.production.local
    ports:
      - "3000:3000"
    restart: unless-stopped

  hold-worker:
    build:
      context: .
      target: worker
    command: npm run worker:holds
    env_file: .env.production.local
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      target: worker
    command: npm run worker:notifications
    env_file: .env.production.local
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: worker
    command: npm run db:migrate
    env_file: .env.production.local
    profiles: ["maintenance"]

  preflight:
    build:
      context: .
      target: worker
    command: npm run deploy:check-env
    env_file: .env.production.local
    profiles: ["maintenance"]

# This compose file intentionally has no PostgreSQL service. Production must use
# a separately managed database with its own backups and encrypted credentials.
